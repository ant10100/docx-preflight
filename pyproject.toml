[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "docx-preflight"
version = "0.1.0"
description = "Read-only OOXML list and document privacy preflight checks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "ant10100"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
docx-preflight = "docx_preflight.cli:main"

[tool.setuptools.packages.find]
include = ["docx_preflight*"]
